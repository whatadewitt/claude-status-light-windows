name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet test tests/StatusLight.Core.Tests
      - run: bash tests/wsl/hook_test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet build StatusLight.slnx -c Release
      - run: dotnet test StatusLight.slnx -c Release
